<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1024px;
            height: 500px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .banner {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #6B1F77 0%, #8B2F97 35%, #A855F7 70%, #C084FC 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .bg-cross {
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 400px;
            opacity: 0.08;
        }
        .bg-cross .vertical {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 100%;
            background: white;
            border-radius: 10px;
        }
        .bg-cross .horizontal {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            border-radius: 10px;
        }
        .bg-circle-1 {
            position: absolute;
            left: -100px;
            bottom: -100px;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }
        .bg-circle-2 {
            position: absolute;
            right: 150px;
            top: -80px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }
        .content {
            display: flex;
            align-items: center;
            gap: 50px;
            z-index: 1;
        }
        .icon-wrapper {
            width: 140px;
            height: 140px;
            background: rgba(255,255,255,0.15);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon-inner {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            overflow: hidden;
        }
        .icon-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .text-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .app-name {
            font-size: 56px;
            font-weight: 800;
            color: white;
            letter-spacing: 3px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .tagline {
            font-size: 22px;
            color: rgba(255,255,255,0.9);
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .features {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            font-weight: 500;
        }
        .feature-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #C084FC;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="bg-cross">
            <div class="vertical"></div>
            <div class="horizontal"></div>
        </div>
        <div class="bg-circle-1"></div>
        <div class="bg-circle-2"></div>
        <div class="content">
            <div class="icon-wrapper">
                <div class="icon-inner">
                    <img src="icon.png" alt="Reconciliare">
                </div>
            </div>
            <div class="text-section">
                <div class="app-name">RECONCILIARE</div>
                <div class="tagline">Prepare sua confissão com fé e tranquilidade</div>
                <div class="features">
                    <div class="feature"><div class="feature-dot"></div> Exame de Consciência</div>
                    <div class="feature"><div class="feature-dot"></div> Orações</div>
                    <div class="feature"><div class="feature-dot"></div> Histórico</div>
                    <div class="feature"><div class="feature-dot"></div> 100% Privado</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
